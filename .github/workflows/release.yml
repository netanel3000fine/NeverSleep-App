name: 🚀 Release Never Sleep

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v19.5.0)"
        required: true
        default: "v19.5.0"
      draft:
        description: "Create as draft release"
        required: false
        default: "false"
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: "false"
        type: boolean

env:
  APP_NAME: "Never Sleep"
  BUNDLE_ID: com.neversleep.app

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Build Windows installer (NSIS + MSI)
  # ─────────────────────────────────────────────
  build-windows:
    name: 🪟 Build · Windows x64
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: 📦 Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x64-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📥 Install Node dependencies
        run: npm ci

      - name: 🔄 Sync dist/ from source root
        shell: pwsh
        run: |
          $files = @("index.html","settings.html","lang.js","debug_logging.js",
                      "overlay.html","sleep.html","tray.html","cleaning.html")
          foreach ($f in $files) {
            if (Test-Path $f) {
              Copy-Item $f "dist\$f" -Force
              Write-Host "  Synced $f -> dist/$f"
            }
          }
          if (Test-Path "fonts") {
            if (-not (Test-Path "dist\fonts")) { New-Item -ItemType Directory "dist\fonts" -Force | Out-Null }
            Copy-Item "fonts\*" "dist\fonts\" -Recurse -Force
          }

      - name: 🧹 Clear stale Tauri codegen cache
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri\target\release\build\" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "app-*" } |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          (Get-Item "src-tauri\build.rs").LastWriteTime = Get-Date

      - name: 🏗️ Build Tauri app (Release)
        run: npm run tauri build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: 📤 Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 7

      - name: 📤 Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 7

      - name: 📤 Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: "src-tauri/target/release/Never Sleep.exe"
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 2 – Publish GitHub Release with assets
  # ─────────────────────────────────────────────
  release:
    name: 🎉 Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ⬇️ Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📥 Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 📋 List downloaded assets
        run: find release-assets -type f | sort

      - name: 🏷️ Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 🗒️ Generate changelog from git log
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges -30)
          fi
          # Escape for multiline GitHub output
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "log<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$LOG"       >> "$GITHUB_OUTPUT"
          echo "$EOF"       >> "$GITHUB_OUTPUT"

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Never Sleep ${{ steps.tag.outputs.tag }}"
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/**/*.exe
            release-assets/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 3 – Post-release housekeeping (optional)
  # ─────────────────────────────────────────────
  housekeeping:
    name: 🧹 Post-release Housekeeping
    needs: release
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: write
      issues: write

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 🗑️ Delete old pre-release drafts (keep last 3)
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              per_page: 50,
            });
            const drafts = releases.data
              .filter(r => r.draft)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(3); // keep the 3 most recent drafts
            for (const d of drafts) {
              core.info(`Deleting old draft: ${d.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                release_id: d.id,
              });
            }

      - name: 📣 Summary
        run: |
          echo "## ✅ Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.release.outputs.tag || 'see workflow' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repo:** https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY
