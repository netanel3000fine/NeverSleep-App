<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <title>Keyboard Locked for Cleaning</title>
    <script src="lang.js"></script>
    <script src="debug_logging.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070c;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.82);
            --text-muted: rgba(255, 255, 255, 0.45);
            --dot-inactive: rgba(255, 255, 255, 0.22);
            --dot-active: #ffffff;
            --dot-glow: rgba(255, 255, 255, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background: radial-gradient(circle at 50% 45%, #0c1220 0%, #04060a 100%);
            color: var(--text-primary);
            font-family: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .cleaning-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 500px;
            padding: 40px 24px;
            gap: 20px;
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Keyboard Icon Badge */
        .icon-badge {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 6px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .icon-badge svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Titles */
        .title {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--text-primary);
            line-height: 1.25;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: -6px;
            letter-spacing: -0.1px;
        }

        /* Dots Indicator */
        .dots-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 6px 0;
            padding: 6px 0;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--dot-inactive);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dot.filled {
            background: var(--dot-active);
            box-shadow: 0 0 14px var(--dot-glow), 0 0 4px #ffffff;
            transform: scale(1.25);
        }

        /* Unlock Pill Button */
        .unlock-btn {
            background: #ffffff;
            color: #090d16;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.1px;
            padding: 12px 46px;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45), 0 0 24px rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        .unlock-btn:hover {
            background: #f8fafc;
            transform: translateY(-1.5px) scale(1.02);
            box-shadow: 0 6px 26px rgba(255, 255, 255, 0.25);
        }

        .unlock-btn:active {
            transform: translateY(0) scale(0.97);
            background: #e2e8f0;
        }

        .unlock-btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        /* Mouse Note */
        .mouse-hint {
            font-size: 13.5px;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: -0.1px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="cleaning-container">
        <!-- Keyboard Icon Badge -->
        <div class="icon-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="3.5" ry="3.5" />
                <!-- Key rows -->
                <line x1="6" y1="8" x2="6.01" y2="8" stroke-width="2.5" />
                <line x1="10" y1="8" x2="10.01" y2="8" stroke-width="2.5" />
                <line x1="14" y1="8" x2="14.01" y2="8" stroke-width="2.5" />
                <line x1="18" y1="8" x2="18.01" y2="8" stroke-width="2.5" />

                <line x1="6" y1="12" x2="6.01" y2="12" stroke-width="2.5" />
                <line x1="10" y1="12" x2="10.01" y2="12" stroke-width="2.5" />
                <line x1="14" y1="12" x2="14.01" y2="12" stroke-width="2.5" />
                <line x1="18" y1="12" x2="18.01" y2="12" stroke-width="2.5" />

                <line x1="8" y1="16" x2="16" y2="16" stroke-width="2" />
            </svg>
        </div>

        <!-- Headings -->
        <h1 class="title" data-i18n="cleaning_title">Keyboard locked for cleaning</h1>
        <p class="subtitle" data-i18n="cleaning_escape_hint">Press Escape 5 times to unlock</p>

        <!-- 5-Dot Indicator -->
        <div class="dots-row" id="dotsRow" aria-label="Progress dots">
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
            <div class="dot" id="dot5"></div>
        </div>

        <!-- Unlock Button -->
        <button type="button" class="unlock-btn" id="unlockBtn" data-i18n="cleaning_unlock_btn">Unlock</button>

        <!-- Mouse Hint -->
        <p class="mouse-hint" data-i18n="cleaning_mouse_hint">Your mouse and trackpad still work</p>
    </div>

    <script>
        const isPrimary = new URLSearchParams(location.search).get('primary') === '1';
        let escapeCount = 0;
        let resetTimer = null;
        const TOTAL_DOTS = 5;

        // Apply language from settings
        try {
            const settings = JSON.parse(localStorage.getItem('neverSleepSettings') || '{}');
            const lang = translations[settings.language] ? settings.language : 'en';
            applyLanguage(lang);
        } catch (e) {
            applyLanguage('en');
        }

        function updateDots(count) {
            escapeCount = count;
            for (let i = 1; i <= TOTAL_DOTS; i++) {
                const dot = document.getElementById(`dot${i}`);
                if (dot) {
                    dot.classList.toggle('filled', i <= count);
                }
            }

            // If count > 0, schedule reset after 3s of inactivity
            clearTimeout(resetTimer);
            if (count > 0 && count < TOTAL_DOTS) {
                resetTimer = setTimeout(() => {
                    updateDots(0);
                }, 3000);
            }
        }

        async function unlockCleaningMode() {
            clearTimeout(resetTimer);
            updateDots(TOTAL_DOTS);
            window.__neverSleepDebugLog?.('Cleaning mode unlock triggered');
            if (window.__TAURI__) {
                try {
                    await window.__TAURI__.invoke('stop_cleaning_mode');
                } catch (e) {
                    window.__neverSleepDebugLog?.(`Failed to stop cleaning mode: ${e}`);
                }
            }
        }

        // Click Unlock Button
        document.getElementById('unlockBtn')?.addEventListener('click', unlockCleaningMode);

        // Listen for backend Escape count events
        if (window.__TAURI__ && window.__TAURI__.event) {
            window.__TAURI__.event.listen('cleaning-escape-progress', (event) => {
                const count = event.payload?.count ?? 0;
                window.__neverSleepDebugLog?.(`Cleaning escape count event: ${count}`);
                updateDots(count);
                if (count >= TOTAL_DOTS) {
                    unlockCleaningMode();
                }
            });
        }

        // Webview Keydown Swallow & Fallback Counter (primary monitor only)
        if (isPrimary) {
            window.addEventListener('keydown', (event) => {
                event.preventDefault();
                event.stopPropagation();

                if (event.key === 'Escape') {
                    const nextCount = escapeCount + 1;
                    updateDots(nextCount);
                    if (nextCount >= TOTAL_DOTS) {
                        unlockCleaningMode();
                    }
                }
            }, true);

            window.addEventListener('keyup', (event) => {
                event.preventDefault();
                event.stopPropagation();
            }, true);

            window.addEventListener('keypress', (event) => {
                event.preventDefault();
                event.stopPropagation();
            }, true);
        }

        // Force focus on load — only primary window grabs focus
        window.addEventListener('load', () => {
            if (isPrimary) {
                window.focus();
                document.getElementById('unlockBtn')?.focus();
            }
        });
    </script>
</body>

</html>
